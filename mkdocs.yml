site_name: "Competent – Nápověda pro studenty"
site_description: Dokumentace studentského portálu Competent od Educasoftu
site_author: Educasoft
site_url: https://educasoftsolutions.github.io/portal-documentation/

repo_name: EducasoftSolutions/portal-documentation
repo_url: https://github.com/EducasoftSolutions/portal-documentation
edit_uri: edit/main/docs/

theme:
  name: material
  language: cs
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Přepnout na tmavý režim
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Přepnout na světlý režim
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/school

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - glightbox
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: |
        Tato dokumentace popisuje studentský portál LMS Competent.
        Zahrnuje návody pro studenty a referenci studentských funkcí.
      sections:
        Úvod:
          - index.md
        Návody:
          - how-to/index.md
        Reference:
          - reference/index.md
          - reference/moje-vzdelavani.md
          - reference/katalog-kurzu.md

hooks:
  - hooks/copy_source.py

nav:
  - Úvod: index.md
  - Návody:
      - Přehled: how-to/index.md
  - Reference:
      - Přehled: reference/index.md
      - Moje vzdělávání: reference/moje-vzdelavani.md
      - Katalog kurzů: reference/katalog-kurzu.md

extra:
  generator: false
